[workspace]
resolver = "3"
exclude = ["horizon-mod"]
members = [
    "crates/terra-codec",
    "crates/terra-projection",
    "crates/terra-elevation",
    "crates/terra-osm",
    "crates/terra-acquisition",
    "crates/terra-chunk-generation",
    "crates/terra-server",
    "crates/terra-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/MaxLananas/Terraplusminusrusted"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
indexing_slicing = "allow"
# `from_geo`/`to_geo` deliberately keep the upstream GeographicProjection method names.
wrong_self_convention = "allow"

[profile.dev]
opt-level = 1

[profile.test]
opt-level = 2

[profile.release]
codegen-units = 16
lto = "thin"
debug = "line-tables-only"
